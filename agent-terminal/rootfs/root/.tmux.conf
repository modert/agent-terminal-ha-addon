# Minimal tmux config for the Agent Terminal add-on.
set -g  mouse on
set -g  history-limit 50000
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 10
set -g  status off
setw -g aggressive-resize on
# Let programs in the pane (Claude Code's mouse selection) copy to the outer
# terminal with OSC 52. The default, "external", silently drops those copies.
set -s  set-clipboard on

# Prefix + d to detach (default), prefix + [ to scroll. Re-enable the status
# bar any time with:  Ctrl-b :  then  set -g status on
