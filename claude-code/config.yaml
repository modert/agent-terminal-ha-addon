name: "Claude Code"
version: "1.1.1"
slug: "claude_code"
description: "Anthropic Claude Code CLI on the HA host - persistent Claude-account login, web terminal + SSH"
url: "https://github.com/anthropics/claude-code"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-happy-outline"
panel_title: "Claude Code"
hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: false
apparmor: false
map:
  - "homeassistant_config:rw"
  - "addons:rw"
  - "share:rw"
  - "ssl:ro"
  - "backup:rw"
  - "media:rw"
ports:
  "2202/tcp": 2202
ports_description:
  "2202/tcp": "SSH - point VS Code Remote-SSH at <ha-host>:2202"
options:
  ssh_port: 2202
  web_command: "claude"
  git_user_name: ""
  git_user_email: ""
  # Add your own SSH public key(s) here after install, e.g.:
  #   - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5... you@yourlaptop"
  authorized_keys: []
schema:
  ssh_port: "port"
  web_command: "str"
  git_user_name: "str?"
  git_user_email: "str?"
  authorized_keys:
    - "str"
